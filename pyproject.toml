[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-tag-organizer"
version = "0.1.0"
description = "Organize your best prompts: scan Markdown/JSON prompt files, add tags/task/score frontmatter, fuzzy tag search, near-duplicate flagging, and a browsable HTML index. Local-first, optional AI tagging via any OpenAI-compatible endpoint (Ollama included)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Asdale Dynamics, LLC" }]
keywords = ["prompts", "cli", "tags", "frontmatter", "ollama", "local-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
prompt-tag-organizer = "prompt_tag_organizer.cli:main"
pto = "prompt_tag_organizer.cli:main"

[project.urls]
Homepage = "https://dylanasdale.github.io"

[tool.setuptools.packages.find]
include = ["prompt_tag_organizer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
